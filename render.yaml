# Render Blueprint for the backend services. Each service has a buildFilter, so
# it rebuilds only when its own folder changes: console (frontend/) changes
# never touch Render. autoDeployTrigger: checksPass means Render deploys a
# commit only after GitHub CI has passed on it, so a broken push never goes live.
services:
  # Replay Lab: the real bifrost-http gateway with Replay Lab loaded as a
  # plugin, routed to Google Gemini (free tier). See the "render" stage at the
  # end of backend/replaylab/loadable/Dockerfile.
  - type: web
    name: replaylab-gateway
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./backend/replaylab/loadable/Dockerfile
    dockerContext: ./backend/replaylab
    healthCheckPath: /replaylab/health
    buildFilter:
      paths:
        - backend/replaylab/**
    envVars:
      # A Google AI Studio key (free tier). The gateway routes to every provider
      # whose key is set; GROQ_API_KEY is also understood.
      - key: GEMINI_API_KEY
        sync: false

  # Stale-Answer Detector API, with Google Gemini (free tier) as its LLM.
  - type: web
    name: stale-detector-api
    runtime: python
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    rootDir: backend/stale
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/health
    buildFilter:
      paths:
        - backend/stale/**
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TAVILY_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite

  # Insights (backend/database/): the read API and the sync worker in one
  # process ("all" mode), filling the Postgres below from the two services'
  # HTTP APIs. The console reads it through VITE_INSIGHTS_URL.
  - type: web
    name: insights-api
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./backend/database/Dockerfile
    dockerContext: ./backend/database
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - backend/database/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: insights-db
          property: connectionString
      - key: REPLAYLAB_URL
        value: https://replaylab-gateway.onrender.com
      - key: STALE_URL
        value: https://stale-detector-api.onrender.com
      # Free services sleep after 15 idle minutes. Polling more often than that
      # would keep both backends awake around the clock and use up the free
      # hours; every start also syncs at once, so data is fresh on wake-up.
      - key: SYNC_INTERVAL_MS
        value: "1200000"

databases:
  - name: insights-db
    plan: free
    databaseName: insights
    user: insights
    postgresMajorVersion: "17"
