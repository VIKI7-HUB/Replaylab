# Tuned for a read-heavy analytics copy on a container with ~2 GB of RAM.
# Scale shared_buffers (~25% of RAM) and effective_cache_size (~75%) with it.
listen_addresses = '*'
max_connections = 100

shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 24MB
maintenance_work_mem = 256MB

# SSD storage
random_page_cost = 1.1
effective_io_concurrency = 200

# Short OLAP-ish queries: JIT compile time costs more than it saves.
jit = off

# Bulk loads (backfill, seed) without checkpoint storms.
max_wal_size = 4GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9
wal_compression = on

# Parallel aggregates for view refreshes.
max_worker_processes = 8
max_parallel_workers_per_gather = 2
max_parallel_workers = 4

shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top

log_min_duration_statement = 250
log_timezone = 'UTC'
timezone = 'UTC'
