name: ci
on:
  push:
  pull_request:
jobs:
  secret-scan:
    name: No secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if a secret or database file is tracked
        run: |
          # .env.example templates are allowed; real .env files and databases are not
          tracked=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|development|dev)$|\.db(-shm|-wal)?$|\.sqlite3?$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Secret or database file is tracked in git:"
            echo "$tracked"
            exit 1
          fi
      - name: Fail if an API key appears in the history
        run: |
          hits=$(git grep -nE 'tvly-[A-Za-z0-9_-]{20,}|gsk_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{35}' $(git rev-list --all) 2>/dev/null | head -5 || true)
          if [ -n "$hits" ]; then
            echo "::error::An API key is present in the git history. Rotate it and purge the history."
            echo "$hits"
            exit 1
          fi

  replaylab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: replaylab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: replaylab/go.mod
          cache-dependency-path: replaylab/go.sum
      - run: go vet ./...
      - run: go test -race ./tests/...
      - run: go run ./demo/run_experiment -latency 0
      - run: go run ./demo/bifrost_embedded -api ""

  # The loadable plugin: build the shared object for the target gateway version
  # (loadable/go.mod), load it into that bifrost-http release and run the
  # gateway smoke test. Shared-object plugins need Linux, so this runs only
  # here, in containers. It also proves the Render image (the last Dockerfile
  # stage) still builds.
  replaylab-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: replaylab
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the shared object
        uses: docker/build-push-action@v6
        with:
          context: replaylab
          file: replaylab/loadable/Dockerfile
          target: plugin
          outputs: type=local,dest=replaylab/dist
          cache-from: type=gha,scope=loadable
          cache-to: type=gha,scope=loadable,mode=max
      - name: Gateway smoke test
        uses: docker/build-push-action@v6
        with:
          context: replaylab
          file: replaylab/loadable/Dockerfile
          target: smoke
          no-cache-filters: smoke
          cache-from: type=gha,scope=loadable
      - name: Gateway demo
        run: docker compose -f loadable/compose.yml up --build --exit-code-from seed
      - name: Gateway demo logs
        if: always()
        run: docker compose -f loadable/compose.yml logs --no-color gateway | tail -n 100

  stale:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stale
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stale/requirements.txt
      - run: pip install -r requirements.txt pyflakes
      - run: python -m pyflakes app tests benchmark demo
      - run: pytest -q
