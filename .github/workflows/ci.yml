name: ci
on:
  push:
  pull_request:
jobs:
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a secret file is tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|development)$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Secret file is tracked in git:"; echo "$tracked"; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Unit tests include the API contract tests: if a change breaks how the
      # console reads a backend response, this step fails.
      - run: npm test
      - run: npm run build
