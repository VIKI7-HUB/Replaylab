name: ci
# Every push and pull request runs this. main is protected: a change merges only
# when every job below passes, and Render deploys only commits that passed.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway:
              - 'backend/replaylab/**'
              - '.github/workflows/ci.yml'

  secret-scan:
    name: No secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a secret or database file is tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|development|dev)$|\.db(-shm|-wal)?$|\.sqlite3?$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Secret or database file is tracked in git:"; echo "$tracked"; exit 1
          fi
      - name: Fail if an API key is in the code
        run: |
          hits=$(git grep -nE 'tvly-[A-Za-z0-9_-]{20,}|gsk_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{35}|sk-[A-Za-z0-9]{32,}' || true)
          if [ -n "$hits" ]; then
            echo "::error::An API key is committed. Remove it and rotate the key."; echo "$hits"; exit 1
          fi

  replaylab:
    name: Replay Lab (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/replaylab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/replaylab/go.mod
          cache-dependency-path: backend/replaylab/go.sum
      - run: go vet ./...
      - run: go test -race ./tests/...
      - run: go run ./demo/run_experiment -latency 0
      - run: go run ./demo/bifrost_embedded -api ""

  # The image Render deploys: build the loadable plugin for its bifrost-http
  # release, load it into that gateway and smoke-test it, then build the final
  # Render stage. Runs only when Replay Lab changed, since it takes minutes.
  replaylab-gateway:
    name: Replay Lab gateway image
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/replaylab
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Gateway smoke test
        uses: docker/build-push-action@v6
        with:
          context: backend/replaylab
          file: backend/replaylab/loadable/Dockerfile
          target: smoke
          no-cache-filters: smoke
          cache-from: type=gha,scope=loadable
          cache-to: type=gha,scope=loadable,mode=max
      - name: Render image builds
        uses: docker/build-push-action@v6
        with:
          context: backend/replaylab
          file: backend/replaylab/loadable/Dockerfile
          cache-from: type=gha,scope=loadable
      - name: Gateway demo
        run: docker compose -f loadable/compose.yml up --build --exit-code-from seed
      - name: Gateway demo logs
        if: always()
        run: docker compose -f loadable/compose.yml logs --no-color gateway | tail -n 100

  stale:
    name: Stale Detector (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/stale
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/stale/requirements.txt
      - run: pip install -r requirements.txt pyflakes
      - run: python -m pyflakes app tests benchmark demo
      - run: pytest -q

  frontend:
    name: Console (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The safety net between the two halves: run the real backends, record their
  # responses, and check the console's schemas against them. A backend change
  # that breaks the console, or a console change that misreads a backend, fails
  # here, whichever side it came from.
  contract:
    name: Console and backends agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/replaylab/go.mod
          cache-dependency-path: backend/replaylab/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/stale/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/stale/requirements.txt
      - run: npm ci
        working-directory: frontend
      - name: Record live responses
        run: bash .github/scripts/record-fixtures.sh "$RUNNER_TEMP/fixtures"
      - name: Console schemas accept the live responses
        working-directory: frontend
        env:
          CONTRACT_FIXTURES_DIR: ${{ runner.temp }}/fixtures
        run: npx vitest run src/tests/contract.test.ts
      - name: Stale reports still carry every field the console reads
        run: python .github/scripts/stale_contract.py
