name: deploy console
# Deploys the console (frontend/) to Vercel, but only after the ci workflow has
# passed on that commit of main, and only when frontend/ changed. A red CI run
# never reaches the live site.
#
# Needs one repository secret: VERCEL_TOKEN (a token from the Vercel account
# that owns the project; Settings > Secrets and variables > Actions).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-console
  cancel-in-progress: false

env:
  # Not secrets: they only name the Vercel team and project.
  VERCEL_ORG_ID: team_eownIq0SFUnbxhskJACwAyrO
  VERCEL_PROJECT_ID: prj_njkfwGn7JJr8yrejL1wJv0rVFAA9

jobs:
  deploy:
    name: Deploy console to Vercel
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Did the console change?
        id: changed
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] || ! git diff --quiet HEAD^ HEAD -- frontend; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend/ unchanged; nothing to deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.deploy == 'true'
        with:
          node-version: 22
      - name: Build and deploy
        if: steps.changed.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Add the VERCEL_TOKEN repository secret (see CONTRIBUTING.md)."; exit 1
          fi
          npm install --global vercel@65.14.0
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed: $url" | tee -a "$GITHUB_STEP_SUMMARY"
